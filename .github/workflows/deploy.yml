name: Frontend verification and release artifact
on:
  pull_request:
  push:
    branches: [main, 'fix/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run build
      - name: Prepare versioned static files
        run: |
          printf '%s\n' "$GITHUB_SHA" > out/REVISION
          (cd out && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-${{ github.sha }}
          path: out/
          if-no-files-found: error
